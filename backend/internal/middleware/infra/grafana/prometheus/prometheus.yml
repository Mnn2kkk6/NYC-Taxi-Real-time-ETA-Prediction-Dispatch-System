global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "nyc-taxi-backend"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        # If you're running Prometheus natively (not in Docker) instead,
        # use "localhost:8080" here.
